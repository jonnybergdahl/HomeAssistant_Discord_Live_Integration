[project]
name = "homeassistant-discord-live"
version = "0.1.0"
description = "Home Assistant integration for Discord scheduled events"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
]
